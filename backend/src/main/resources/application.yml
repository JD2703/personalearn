server:
  port: ${PORT:8080}

spring:
  application:
    name: personalearn
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    # Set JWT_SECRET (>= 32 chars) as an environment variable. Never commit a real value.
    # If it's not set, a random key is generated at startup (tokens then reset on every restart).
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    enabled: ${SEED_DATA:true}
  ai:
    # Optional: set ANTHROPIC_API_KEY to power the chatbot with Claude.
    # Without it, the built-in rule-based MBTI tutor is used.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-haiku-5-5}

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/personalearn?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

---
# Zero-setup local profile: in-memory H2 in MySQL compatibility mode
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:personalearn;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
